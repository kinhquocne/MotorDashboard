<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" role="img" aria-label="Sơ đồ mạch điện nối DS18B20 với ESP32">
  <!-- Styles -->
  <style>
    .stroke-main { stroke: currentColor; stroke-width: 2; }
    .text-main { fill: currentColor; font-family: sans-serif; font-size: 14px; }
    .text-title { fill: currentColor; font-family: sans-serif; font-size: 16px; font-weight: bold; }
    .wire-pwr { stroke: #ef4444; stroke-width: 3; fill: none; }
    .wire-data { stroke: #3b82f6; stroke-width: 3; fill: none; }
    .wire-gnd { stroke: currentColor; stroke-width: 3; fill: none; opacity: 0.7; }
    .dot { fill: currentColor; }
  </style>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" class="text-title">Sơ đồ đấu nối Cảm biến DS18B20 và ESP32 (Có điện trở Pull-up)</text>

  <!-- ESP32 Board -->
  <rect x="50" y="60" width="120" height="150" rx="8" class="stroke-main" fill="none" />
  <text x="110" y="85" text-anchor="middle" font-weight="bold" class="text-main">ESP32</text>
  
  <text x="155" y="125" text-anchor="end" class="text-main">3.3V</text>
  <line x1="170" y1="120" x2="190" y2="120" class="wire-pwr" />
  
  <text x="155" y="160" text-anchor="end" class="text-main">GPIO 5</text>
  <line x1="170" y1="155" x2="190" y2="155" class="wire-data" />
  
  <text x="155" y="195" text-anchor="end" class="text-main">GND</text>
  <line x1="170" y1="190" x2="190" y2="190" class="wire-gnd" />

  <!-- DS18B20 Sensor -->
  <rect x="430" y="80" width="100" height="130" rx="8" class="stroke-main" fill="none" />
  <text x="480" y="105" text-anchor="middle" font-weight="bold" class="text-main">DS18B20</text>
  
  <text x="445" y="125" text-anchor="start" class="text-main">VCC</text>
  <line x1="410" y1="120" x2="430" y2="120" class="wire-pwr" />
  
  <text x="445" y="160" text-anchor="start" class="text-main">DQ</text>
  <line x1="410" y1="155" x2="430" y2="155" class="wire-data" />
  
  <text x="445" y="195" text-anchor="start" class="text-main">GND</text>
  <line x1="410" y1="190" x2="430" y2="190" class="wire-gnd" />

  <!-- Main Wires -->
  <line x1="190" y1="120" x2="410" y2="120" class="wire-pwr" />
  <line x1="190" y1="155" x2="410" y2="155" class="wire-data" />
  <line x1="190" y1="190" x2="410" y2="190" class="wire-gnd" />

  <!-- Pull-up Resistor -->
  <line x1="300" y1="120" x2="300" y2="125" class="stroke-main" />
  <path d="M 300 125 L 285 130 L 315 137 L 285 144 L 300 150" fill="none" class="stroke-main" stroke-linejoin="round" />
  <line x1="300" y1="150" x2="300" y2="155" class="stroke-main" />
  
  <!-- Connection Dots -->
  <circle cx="300" cy="120" r="5" class="dot" />
  <circle cx="300" cy="155" r="5" class="dot" />
  
  <!-- Resistor Label -->
  <text x="325" y="142" class="text-main" font-weight="bold">Điện trở 4.7kΩ (Pull-up)</text>
</svg>